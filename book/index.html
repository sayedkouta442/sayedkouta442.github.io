<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PageX — الكتاب</title>
<meta property="og:title" content="PageX — بيع واشتري الكتب المستعملة">
<meta property="og:description" content="شوف الكتاب ده على PageX.">
<meta property="og:type" content="website">
<style>
  :root { --green: #0E6B55; --ink: #1A1A1A; --muted: #6B7280; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; background: #F8F9FB; color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    padding: 24px; text-align: center;
  }
  .card { max-width: 380px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); line-height: 1.7; margin: 0 0 24px; }
  a.btn {
    display: inline-block; background: var(--green); color: #fff;
    text-decoration: none; padding: 14px 28px; border-radius: 14px;
    font-weight: 700; font-size: 16px;
  }
  .small { font-size: 13px; margin-top: 16px; }
  @media (prefers-color-scheme: dark) {
    body { background: #121212; color: #fff; }
    p { color: #9CA3AF; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>افتح الكتاب في تطبيق PageX</h1>
    <p>لو التطبيق متثبّت عندك، الكتاب هيفتح على طول. لو لأ، نزّله من
       Google Play وافتح الرابط تاني.</p>
    <a class="btn" id="store"
       href="https://play.google.com/store/apps/details?id=io.bookchange.app">
       تنزيل من Google Play</a>
    <p class="small">PageX — بيع واشتري الكتب المستعملة في مصر</p>
  </div>

<script>
// الصفحة دي مبتتفتحش أصلاً لو التطبيق متثبّت والروابط متحقّق منها:
// أندرويد بيمسك الرابط ويفتح التطبيق قبل ما المتصفّح يشتغل.
//
// فاللي بيوصل هنا واحد من اتنين: مش مثبّت التطبيق، أو فاتح على كمبيوتر.
// الاتنين وجهتهم المتجر — بس بنمرّر المعرّف في `referrer` عشان بعد
// التثبيت التطبيق يعرف يفتح على نفس العرض.
(function () {
  var id = new URLSearchParams(location.search).get('id');
  if (!id) return;

  var store = document.getElementById('store');
  store.href += '&referrer=' + encodeURIComponent('book=' + id);

  // تحويل تلقائي على الموبايل بس — على الكمبيوتر بنسيب الصفحة ظاهرة.
  if (/android/i.test(navigator.userAgent)) {
    setTimeout(function () { location.href = store.href; }, 1200);
  }
})();
</script>
</body>
</html>
